name: CI/CD to Local Registry

on:
  push:
    branches: [ main]

jobs:
  build-and-push:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Version Tag
        id: prep
        run: |
          # 短縮コミットハッシュと日時からバージョン文字列を生成
          SHA=$(git rev-parse --short HEAD)
          VERSION="1.0.0-$(date +'%Y%m%d%H%M%S')-${SHA}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Build and Push Docker Image
        run: |
          VERSION="${{ steps.prep.outputs.version }}"
          
          docker build -t 192.168.1.148:5000/order-management:latest \
                       -t 192.168.1.148:5000/order-management:${VERSION} .
                       
          docker push 192.168.1.148:5000/order-management:latest
          docker push 192.168.1.148:5000/order-management:${VERSION}